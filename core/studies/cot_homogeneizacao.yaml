  - "Como reduzir o desperdício de comida em casa"
  - "Um jeito melhor de aprender uma habilidade nova sozinho"
  - "Como deixar um parque público mais vivo à noite"
  - "Uma forma de as pessoas pouparem dinheiro sem sofrer"
