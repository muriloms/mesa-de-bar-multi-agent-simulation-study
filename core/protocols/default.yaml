# Protocolo padrão — v2
# N rodadas (4), sem aposta. Juiz IA escolhe a melhor a cada rodada.
# Ideias anônimas na escolha (autoria revelada depois). Avança a escolha do juiz.
id: default
version: 3.0.0
description: >
  Padrão v2: 4 rodadas, escolha anônima da melhor ideia, juiz IA por
  originalidade, a ideia do juiz avança (model-led). Dono neutral.
language: pt

llm_default_provider: google
llm_default_model: gemini-1.5-flash
llm_temperature: 0.7

llm_seed_strategy: random_logged
randomization_seed: null

rounds: 4
quem_avanca: juiz_ia
source_blind_on_choice: true

judge:
  criterion: originalidade
  blind_to_source: true

owner:
  bias: neutral

memory:
  mode: reflected_summary

telemetry:
  capture_keystrokes: true
  aggregate_metrics: true

instruments:
  pre_session: pre_session_cocreation_v1
  post_session: post_session_cocreation_v1
  post_round: null
