

# Servidor escutando na porta 80
server {
    listen 80;
    server_name localhost; # Ou o domínio da sua aplicação

    # Localização raiz dos arquivos estáticos
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Configuração para servir arquivos estáticos diretamente
    location / {
        # Tenta servir o arquivo solicitado diretamente ($uri)
        # Se não encontrar, tenta servir um diretório ($uri/)
        # Se não encontrar, redireciona para /index.html (tratamento SPA)
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Configurações adicionais (cache, gzip, etc.)
    # Exemplo Gzip:
    # gzip on;
    # gzip_vary on;
    # gzip_proxied any;
    # gzip_comp_level 6;
    # gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Tratamento de erros (opcional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}