# ===========================================================================
# SIMULAÇÃO — RUN A×B×C (72 células). Produção, NÃO é teste. Veja simulacao.yaml p/ o teste.
# Usa SOMENTE chaves já suportadas pelo runner atual. Sem Fator D (modelos por
# papel), sem variantes de loop, sem yoked — esses estão em simulacao_completa.yaml
# e em simulacao_decomposicao.yaml e dependem dos 3 itens novos do runner.
#
# Núcleo aqui: A(2) × B(3) × C(2) × 6 temas = 72 células×tema.
# >>> Rode com dry_run: true primeiro (conta sessões e estima custo). <<<
# ===========================================================================

run_id: null
seed: 20260629
n_games: 20                  # mesas por célula por jogador-sintético (ajuste por poder)

# População: os 9 jogadores (3 personas × 3 temperaturas). 'todos' também
# funciona se a pasta jogadores_simulados/ tiver só estes 9 arquivos.
jogadores: [cauteloso_t04, cauteloso_t07, cauteloso_t10, equilibrado_t04, equilibrado_t07, equilibrado_t10, ousado_t04, ousado_t07, ousado_t10]

condicoes:
  best_idea: [judge, player, player_decides]                      # FATOR B
  composicao: [comum, celebridade]                                # FATOR A
  source_blind_on_choice: [true, false]                           # FATOR C
  rounds: [6]                                                     # controle (R=6)
  judge_criterion: [composto]                                    # controle (composto)
  # CONTROLE — 6 temas, 1 por nível de complexidade (cotidiano -> especulativo).
  tema: ["Como reduzir o desperdício de comida em casa?", "Uma nova forma de as pessoas fazerem amizades na vida adulta", "O que torna uma vida bem vivida?", "Como reduzir as alucinações de modelos de linguagem?", "Como uma cidade média pode se adaptar a eventos climáticos extremos?", "Como seria uma cidade projetada para o ócio, e não para o trabalho?"]

formularios: "off"
output_dir: data/sim_runs
mark_synthetic: true
dry_run: true
max_parallel: 4
