id: pre_session_cocreation_v1
version: 1.0.0
moment: pre_session
title: Antes de começarmos
description: >
  Algumas perguntas rápidas pra contextualizar a sessão. Suas respostas
  são gravadas com a sessão e usadas em análise de pesquisa.

sections:
  - id: profile
    title: Sobre você
    description: Dados básicos (anônimos).
    items:
      - id: age_range
        type: single_select
        question: Qual sua faixa etária?
        options: ["18-24", "25-34", "35-44", "45-54", "55-64", "65+"]

      - id: education
        type: single_select
        question: Qual seu nível de escolaridade mais alto?
        options:
          - Ensino fundamental
          - Ensino médio
          - Graduação em andamento
          - Graduação completa
          - Pós-graduação (especialização/MBA)
          - Mestrado
          - Doutorado

      - id: field
        type: text_short
        question: Qual sua área principal de atuação ou estudo?
        placeholder: ex. engenharia de software, design, biologia, jornalismo
        max_length: 80
        required: false

  - id: ai_experience
    title: Sua relação com IA
    description: Pra entender de que ponto de partida você chega à mesa.
    items:
      - id: ai_familiarity
        type: likert
        question: Quão familiar você se considera com IA generativa (ChatGPT, Claude, Gemini etc)?
        scale: 5
        labels:
          - Nunca usei
          - Já experimentei
          - Uso ocasional
          - Uso frequente
          - Uso diário, profundo

      - id: ai_use_purposes
        type: multi_select
        question: Pra que você usa IA generativa hoje? (selecione todas que se aplicam)
        options:
          - Não uso
          - Curiosidade pessoal
          - Aprender coisas novas
          - Brainstorm e ideação
          - Escrever textos
          - Programação
          - Análise de dados
          - Tarefas do trabalho
          - Estudo formal
          - Criação artística

      - id: ai_trust
        type: likert
        question: Quanto você confia nas respostas da IA generativa?
        scale: 5
        labels: ["Confio muito pouco", "Pouco", "Mais ou menos", "Bastante", "Confio bastante"]

      - id: brainstorm_with_ai
        type: likert
        question: Quão útil você acha a IA pra brainstorm e geração de ideias?
        scale: 5
        labels: ["Inútil", "Pouco útil", "Neutro", "Útil", "Muito útil"]

  - id: expectations
    title: Expectativas
    description: Sem certo ou errado — só queremos saber como você chega aqui.
    items:
      - id: expectation_creativity
        type: slider
        question: Quão criativa você espera que essa discussão seja?
        min: 0
        max: 100
        step: 1
        default: 50
        min_label: nada criativa
        max_label: muito criativa

      - id: expectation_useful
        type: slider
        question: Quão útil você espera que a ideia final seja?
        min: 0
        max: 100
        step: 1
        default: 50
        min_label: inútil
        max_label: muito útil

      - id: open_expectation
        type: text_long
        question: Em uma frase, o que você espera dessa conversa?
        placeholder: ex. quero ver se ajuda a destravar um problema...
        max_length: 280
        required: false
