# ===========================================================================
# SIMULAÇÃO — TESTE MÍNIMO (para desenvolver o notebook de análise)
# Objetivo: gerar dados BARATOS que exercitem TODA a estrutura que o parser
# vai ler — não tem pretensão estatística.
#
# O que este teste cobre de propósito:
#   • best_idea com os 3 modos (judge / player / player_decides) -> cada um
#     produz eventos round.* diferentes; o parser precisa lidar com os três.
#   • 4 sessões por célula (2 jogadores × n_games=2) -> permite calcular a
#     diversidade coletiva (DV de RQ2), que precisa de >1 sessão por célula.
#   • 2 jogadores nos EXTREMOS (cauteloso frio × ousado quente) -> contraste
#     de comportamento e teste do agrupamento por jogador (efeito aleatório).
#   • rounds: 3 -> trajetória de convergência curta, mas com inclinação visível.
#
# Dimensionamento (confira com dry_run):
#   células        = best_idea(3) × composicao(1) × source_blind(1) × tema(1) = 3
#   total_sessions = 3 × jogadores(2) × n_games(2) = 12
#   approx_calls   ≈ 12 × ~22 (rounds=3) ≈ ~264   (vs 557.280 do run completo)
#
# Para CRESCER rumo ao estudo real: adicione 'celebridade' em composicao,
# mais temas, [true,false] em source_blind, e suba n_games. O run A×B×C
# completo está em simulacao_abc.yaml.
# ===========================================================================

run_id: null
seed: 20260629
n_games: 2                   # baixo de propósito (4 sessões/célula com 2 jogadores)

# 2 jogadores nos extremos (não os 9) — barato e com contraste forte.
jogadores: [cauteloso_t04, ousado_t10]

condicoes:
  best_idea: [judge, player, player_decides]   # os 3 modos (essencial p/ o parser)
  composicao: [comum]                          # 1 só (adicione celebridade depois)
  source_blind_on_choice: [true]               # 1 nível
  rounds: [3]                                  # rodadas curtas
  judge_criterion: [composto]                  # fixo
  tema: ["Como reduzir o desperdício de comida em casa?"]   # 1 tema (cotidiano)

formularios: "off"
output_dir: data/sim_runs
mark_synthetic: true
dry_run: false               # gere os dados (mude p/ true só para contar/estimar)
max_parallel: 2
