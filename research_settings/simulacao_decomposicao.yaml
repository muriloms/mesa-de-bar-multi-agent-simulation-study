# ===========================================================================
# SIMULAÇÃO — DECOMPOSIÇÃO DA HOMOGENEIZAÇÃO (variantes do loop B0–B3)
#
# Cada variante REMOVE um mecanismo do loop, na MESMA célula de referência,
# para isolar de onde vem a homogeneização (desligamos uma peça e medimos o
# efeito):
#   efeito da iteração      = B2 − B0
#   efeito da seleção       = B1 − B3   (ou B3 − B1, conforme sinal)
#   efeito da realimentação = B3 − B2
# *** AS VARIANTES DO LOOP REQUEREM SUPORTE NOVO DO RUNNER (ver NOTAS_*.md) ***
# ===========================================================================

run_id: null
seed: 20260629
n_games: 30                  # mais sessões/condição: a DV aqui é entre-sessões

jogadores: [cauteloso_t04, cauteloso_t07, cauteloso_t10, equilibrado_t04, equilibrado_t07, equilibrado_t10, ousado_t04, ousado_t07, ousado_t10]

# CÉLULA DE REFERÊNCIA (fixa) — sobre ela rodam todas as variantes.
celula_referencia:
  best_idea: judge             # condução de referência (model-led)
  composicao: comum
  source_blind_on_choice: true # anonima
  model_pairing: same_model
  judge_criterion: composto
  rounds: 6

# Mesmos 6 temas balanceados do núcleo (um por nível de complexidade).
tema: ["Como reduzir o desperdício de comida em casa?", "Uma nova forma de as pessoas fazerem amizades na vida adulta", "O que torna uma vida bem vivida?", "Como reduzir as alucinações de modelos de linguagem?", "Como uma cidade média pode se adaptar a eventos climáticos extremos?", "Como seria uma cidade projetada para o ócio, e não para o trabalho?"]

# VARIANTES DO LOOP a rodar (cada uma remove/mantém um mecanismo):
#   independente      (B0): sem loop/seleção/realimentação; agentes geram em
#                           paralelo. Gera o REFERENCE SET de originalidade.
#   selecao_aleatoria (B1): a ideia que avança é sorteada (sem juiz/escolhedor).
#   sem_realimentacao (B2): vencedor NÃO entra no contexto da rodada seguinte.
#   loop_completo     (B3): condição cheia (referência).
variantes_loop: [independente, selecao_aleatoria, sem_realimentacao, loop_completo]

juiz: juiz_composto
formularios: "off"
output_dir: data/sim_runs
mark_synthetic: true
dry_run: true
max_parallel: 8
